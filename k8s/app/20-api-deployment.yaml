apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina-mecanica
  labels:
    app: oficina-api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1                
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "aguardando o postgres em oficina-postgres:5432..."
              until nc -z oficina-postgres 5432; do sleep 2; done
              echo "postgres disponivel."
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER        
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          resources:
            requests:
              cpu: "100m"                
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:                   
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
