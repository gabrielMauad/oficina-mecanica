apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  Jwt__Issuer: "oficina-mecanica-app"
  Jwt__Audience: "oficina-mecanica-api"
  Jwt__ValidIssuers__0: "oficina-mecanica-app"
  Jwt__ValidIssuers__1: "oficina-mecanica-auth"
  Auth__AdminEmail: "admin@oficina.com"
  OpenApi__Enabled: "true"
  # Destino do OTLP (traces + métricas). Sem nada específico de fornecedor: aponta para o
  # coletor/APM escolhido (ex.: OpenTelemetry Collector, Datadog Agent, New Relic OTLP
  # endpoint). Chave de API de fornecedor, se necessária, vai em Secret (OTEL_EXPORTER_OTLP_HEADERS
  # com "api-key=..."), nunca aqui.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.oficina-mecanica.svc.cluster.local:4317"
